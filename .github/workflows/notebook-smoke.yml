name: Notebook smoke

on:
  pull_request:
    paths:
      - "_notebooks/**/*.ipynb"
      - "scripts/smoke_notebooks.py"
      - "scripts/smoke.yml"
      - "requirements-smoke.txt"
      - ".github/workflows/notebook-smoke.yml"
  schedule:
    # Weekly full suite (Sunday 04:00 UTC)
    - cron: "0 4 * * 0"
  workflow_dispatch:
    inputs:
      only:
        description: "Optional notebook prefixes (space-separated), e.g. 01 12. Empty = all except skipped."
        required: false
        default: ""

concurrency:
  group: notebook-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-smoke.txt

      - name: Install smoke dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-smoke.txt

      - name: Cache pods / notebook data downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.pods_data
            _notebooks/data
          key: pods-data-${{ runner.os }}-${{ hashFiles('requirements-smoke.txt') }}
          restore-keys: |
            pods-data-${{ runner.os }}-

      - name: Run notebook smoke tests
        env:
          MPLBACKEND: Agg
          JUPYTER_PLATFORM_DIRS: "1"
        run: |
          set -euo pipefail
          ONLY="${{ github.event.inputs.only }}"
          if [ -n "${ONLY}" ]; then
            # shellcheck disable=SC2086
            python scripts/smoke_notebooks.py --only ${ONLY}
          else
            python scripts/smoke_notebooks.py
          fi

      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notebook-smoke-results
          path: |
            _notebooks/test-results/summary.json
            _notebooks/test-results/*.ok
            _notebooks/test-results/*.fail
          if-no-files-found: ignore
